<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina - Intentional Dating</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-rose: #f43f5e;
            --accent-emerald: #10b981;
            --accent-blue: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- AUTH SCREEN --- */
        .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .view.active { display: flex; justify-content: center; align-items: center; }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 10s infinite ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: #f43f5e; top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -150px; right: -150px; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .auth-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .logo i { font-size: 28px; color: var(--accent-rose); }
        .logo span { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; font-weight: 700; }
        #auth-subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent-rose);
            background: rgba(15, 23, 42, 0.9);
        }
        .input-group select { appearance: none; cursor: pointer; }
        .input-group select option { background: var(--bg-primary); }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-rose), #e11d48);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-primary:active { transform: scale(0.98); }

        .toggle-text { text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 14px; }
        .toggle-text a { color: var(--accent-rose); text-decoration: none; font-weight: 600; margin-left: 5px; }

        .hidden { display: none !important; }

        /* --- DASHBOARD SCREEN --- */
        #view-dashboard { flex-direction: column; background: var(--bg-primary); }

        .app-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-small { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
        .logo-small i { color: var(--accent-rose); }
        
        .user-stats { display: flex; align-items: center; gap: 16px; }
        .stat-badge {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-badge i { color: var(--accent-emerald); }
        .profile-pic {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid var(--glass-border);
        }

        .swipe-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .card-stack {
            width: 90%;
            max-width: 400px;
            height: 70vh;
            max-height: 600px;
            position: relative;
        }

        .swipe-card {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            position: absolute;
            background: #1e293b;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            transform-origin: bottom center;
        }
        
        .swipe-card.swiping-right { transform: translateX(150%) rotate(30deg); opacity: 0; pointer-events: none; }
        .swipe-card.swiping-left { transform: translateX(-150%) rotate(-30deg); opacity: 0; pointer-events: none; }
        .swipe-card.swiping-up { transform: translateY(-150%) scale(0.8); opacity: 0; pointer-events: none; }

        .card-bg { position: absolute; inset: 0; z-index: 1; }
        
        .card-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
            padding: 30px;
        }

        .card-header { position: absolute; top: 20px; left: 20px; z-index: 3; }
        .badge {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .card-footer h2 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .card-footer p { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.5; }

        .action-bar {
            padding: 20px 0 40px;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 10;
        }

        .action-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn.pass { border-color: var(--accent-rose); color: var(--accent-rose); }
        .action-btn.pass:hover { background: var(--accent-rose); color: white; }
        .action-btn.super { border-color: var(--accent-blue); color: var(--accent-blue); width: 52px; height: 52px; font-size: 20px; align-self: center; }
        .action-btn.super:hover { background: var(--accent-blue); color: white; }
        .action-btn.like { border-color: var(--accent-emerald); color: var(--accent-emerald); }
        .action-btn.like:hover { background: var(--accent-emerald); color: white; }

        .empty-state, .loading-state {
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-state i, .loading-state i { font-size: 48px; margin-bottom: 20px; color: var(--text-primary); }
        .empty-state h2 { font-size: 24px; color: var(--text-primary); margin-bottom: 10px; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            font-weight: 500;
            border: 1px solid var(--glass-border);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--accent-rose); }
        .toast.success { border-color: var(--accent-emerald); }
    </style>
</head>
<body>

    <!-- AUTH VIEW -->
    <div id="view-auth" class="view active">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        
        <div class="auth-container">
            <div class="logo">
                <i class="fa-solid fa-fire-flame-curved"></i>
                <span>Lumina</span>
            </div>
            <h1 id="auth-title">Find Your Person</h1>
            <p id="auth-subtitle">Sign in to start your intentional journey.</p>

            <form id="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                
                <div id="signup-fields" class="hidden">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Display Name">
                    </div>
                    <div class="input-group select-group">
                        <i class="fa-solid fa-heart"></i>
                        <select id="intent" required>
                            <option value="" disabled selected>What are you looking for?</option>
                            <option value="marriage">💍 Marriage</option>
                            <option value="long_term">❤️ Long Term</option>
                            <option value="casual">🔥 Casual</option>
                            <option value="friends">🤝 Friends</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="auth-btn" class="btn-primary">
                    <span id="btn-text">Sign In</span>
                    <i class="fa-solid fa-spinner fa-spin hidden" id="btn-loader"></i>
                </button>
            </form>

            <p class="toggle-text">
                <span id="toggle-prompt">Don't have an account?</span>
                <a href="#" id="toggle-link">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="view-dashboard" class="view">
        <header class="app-header">
            <div class="logo-small">
                <i class="fa-solid fa-fire-flame-curved"></i>
                <span>Lumina</span>
            </div>
            <div class="user-stats">
                <div class="stat-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span id="trust-score">100</span>
                </div>
                <div class="profile-pic">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </header>

        <main class="swipe-area">
            <div class="card-stack" id="card-stack"></div>
            
            <div class="empty-state hidden" id="empty-state">
                <i class="fa-solid fa-magnifying-glass-location"></i>
                <h2>No more profiles</h2>
                <p>You've seen everyone matching your criteria.<br>Check back later!</p>
            </div>
            
            <div class="loading-state" id="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Finding your matches...</p>
            </div>
        </main>

        <footer class="action-bar">
            <button class="action-btn pass" onclick="swipe('left')">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button class="action-btn super" onclick="swipe('up')">
                <i class="fa-solid fa-star"></i>
            </button>
            <button class="action-btn like" onclick="swipe('right')">
                <i class="fa-solid fa-heart"></i>
            </button>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // --- 1. SUPABASE INITIALIZATION ---
        const SUPABASE_URL = 'https://npnbtpxjpxxenajzwits.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wbmJ0cHhqcHh4ZW5hanp3aXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDg0NzEsImV4cCI6MjA5NjcyNDQ3MX0.4e9cD-7BXy-fLQF0AgCZYYTopor4B6knmj9c-cWIuKI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let deck = [];
        let isSwiping = false;

        const gradients = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
        ];

        const intentBadges = {
            'marriage': '💍 Marriage',
            'long_term': '❤️ Long Term',
            'casual': '🔥 Casual',
            'friends': '🤝 Friends'
        };

        // --- 2. AUTH LOGIC ---
        const authForm = document.getElementById('auth-form');
        const signupFields = document.getElementById('signup-fields');
        const toggleLink = document.getElementById('toggle-link');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const togglePrompt = document.getElementById('toggle-prompt');
        const btnText = document.getElementById('btn-text');
        
        let isSignUp = false;

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUp = !isSignUp;
            signupFields.classList.toggle('hidden');
            
            if (isSignUp) {
                authTitle.innerText = 'Create Account';
                authSubtitle.innerText = 'Join the most intentional dating app.';
                togglePrompt.innerText = 'Already have an account?';
                toggleLink.innerText = 'Sign In';
                btnText.innerText = 'Create Account';
            } else {
                authTitle.innerText = 'Find Your Person';
                authSubtitle.innerText = 'Sign in to start your intentional journey.';
                togglePrompt.innerText = "Don't have an account?";
                toggleLink.innerText = 'Sign Up';
                btnText.innerText = 'Sign In';
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loader = document.getElementById('btn-loader');
            
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            if (isSignUp) {
                const username = document.getElementById('username').value;
                const intent = document.getElementById('intent').value;
                
                if(!username || !intent) {
                    showToast('Please fill all fields', 'error');
                    resetBtn(); return;
                }

                const { error } = await supabaseClient.auth.signUp({
                    email, password,
                    options: { data: { username, intent } }
                });
                if (error) showToast(error.message, 'error');
                else showToast('Account created! Please check email if required.', 'success');
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) showToast(error.message, 'error');
            }
            resetBtn();
        });

        function resetBtn() {
            document.getElementById('btn-loader').classList.add('hidden');
            document.getElementById('btn-text').classList.remove('hidden');
        }

        // --- 3. SESSION & ROUTING ---
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                document.getElementById('view-auth').classList.remove('active');
                document.getElementById('view-dashboard').classList.add('active');
                loadDeck();
            } else {
                currentUser = null;
                document.getElementById('view-dashboard').classList.remove('active');
                document.getElementById('view-auth').classList.add('active');
            }
        });

        // --- 4. DASHBOARD LOGIC ---
        async function loadDeck() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            
            // Fetch profiles. RLS will automatically filter by intent, trust score, etc!
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .limit(10);

            document.getElementById('loading-state').classList.add('hidden');

            if (error) {
                showToast('Error loading profiles', 'error');
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            deck = data;
            renderCards();
        }

        function renderCards() {
            const stack = document.getElementById('card-stack');
            stack.innerHTML = '';
            
            // Render up to 3 cards for a stack effect
            const cardsToShow = deck.slice(0, 3).reverse();
            
            cardsToShow.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = 'swipe-card';
                card.style.zIndex = index + 1;
                
                // Scale down background cards slightly
                if (index < cardsToShow.length - 1) {
                    card.style.transform = `scale(${0.95 - (cardsToShow.length - 1 - index) * 0.05}) translateY(${10 + (cardsToShow.length - 1 - index) * 10}px)`;
                    card.style.opacity = 0.8;
                }

                const gradient = gradients[Math.floor(Math.random() * gradients.length)];
                const badge = intentBadges[profile.intent] || '❤️ Dating';
                const bio = profile.bio || 'Lives life to the fullest. Let\'s grab coffee!';

                card.innerHTML = `
                    <div class="card-bg" style="background: ${gradient};"></div>
                    <div class="card-header">
                        <span class="badge">${badge}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-footer">
                            <h2>${profile.username}, 26</h2>
                            <p>${bio}</p>
                        </div>
                    </div>
                `;
                stack.appendChild(card);
            });
        }

        async function swipe(direction) {
            if (isSwiping || deck.length === 0) return;
            isSwiping = true;

            const stack = document.getElementById('card-stack');
            const topCard = stack.lastElementChild;
            
            if (!topCard) { isSwiping = false; return; }

            // Animate out
            if (direction === 'right') topCard.classList.add('swiping-right');
            else if (direction === 'left') topCard.classList.add('swiping-left');
            else topCard.classList.add('swiping-up');

            // Record swipe in DB
            const action = direction === 'right' ? 'like' : direction === 'left' ? 'pass' : 'super_like';
            const targetProfile = deck[deck.length - 1];
            
            await supabaseClient.from('swipes').insert({
                user_id: currentUser.id,
                target_id: targetProfile.id,
                action: action
            });

            // Remove from deck and render next
            setTimeout(() => {
                deck.pop();
                topCard.remove();
                isSwiping = false;
                
                if (deck.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                } else {
                    renderCards(); // Re-render to bring next card to front
                }
            }, 500);
        }

        // --- 5. UTILS ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
